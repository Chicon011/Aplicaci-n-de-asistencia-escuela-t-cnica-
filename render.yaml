services:
  - type: web
    name: control-asistencia-escolar
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: escolar-postgres-db
          property: connectionString

databases:
  - name: escolar-postgres-db
    plan: free
    databaseName: escolar_db
    user: escolar_user
